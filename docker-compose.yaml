# Anands Fino: app + Postgres. The broker link is the cTrader Open API (no MetaTrader, no Wine).
# Coolify: Application > Build Pack "Docker Compose" > location /docker-compose.yaml.
# Domain: app -> port 8000. Put the same https address in your cTrader app's redirect URI (see README).
services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SERVICE_FQDN_APP_8000
      - DATABASE_URL=postgresql://fino:${SERVICE_PASSWORD_POSTGRES}@db:5432/fino
      - BROKER=${BROKER:-ctrader}
      - CTRADER_CLIENT_ID=${CTRADER_CLIENT_ID:-}
      - CTRADER_CLIENT_SECRET=${CTRADER_CLIENT_SECRET:-}
      - CTRADER_ENV=${CTRADER_ENV:-demo}
      - CTRADER_ACCOUNT_ID=${CTRADER_ACCOUNT_ID:-}
      - CTRADER_DEMO_ACCOUNT_ID=${CTRADER_DEMO_ACCOUNT_ID:-}
      - CTRADER_LIVE_ACCOUNT_ID=${CTRADER_LIVE_ACCOUNT_ID:-}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
      - MODE=${MODE:-research}
      - PAPER_MODE=${PAPER_MODE:-true}
      - PAPER_FEED=${PAPER_FEED:-yahoo}
      - TWELVEDATA_API_KEY=${TWELVEDATA_API_KEY:-}
      - PAPER_BALANCE=${PAPER_BALANCE:-10000}
      - ALLOW_LIVE=${ALLOW_LIVE:-false}
      - TIMEFRAME_MIN=${TIMEFRAME_MIN:-3}
      - CLAUDE_COOLDOWN_MIN=${CLAUDE_COOLDOWN_MIN:-15}
      - MIN_AGREE_PCT=${MIN_AGREE_PCT:-60}
      - MAX_SPREAD_TO_STOP=${MAX_SPREAD_TO_STOP:-0.10}
      - MIN_STOP_SPREADS=${MIN_STOP_SPREADS:-0}
      - MAX_STOP_ATR=${MAX_STOP_ATR:-3.5}
      - MIN_ATR_TO_SPREAD=${MIN_ATR_TO_SPREAD:-2}
      - SYMBOLS=${SYMBOLS:-XAUUSD,XAGUSD,EURUSD,GBPUSD,USDJPY,USDCHF,USDCAD,AUDUSD,NZDUSD,EURJPY,GBPJPY,EURGBP,AUDJPY}
      - SYMBOL_MAP=${SYMBOL_MAP:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-5-5}
      - CLAUDE_MAX_CALLS_PER_DAY=${CLAUDE_MAX_CALLS_PER_DAY:-40}
      - FREELLMAPI_BASE_URL=${FREELLMAPI_BASE_URL:-}
      - FREELLMAPI_KEY=${FREELLMAPI_KEY:-}
      - FREELLMAPI_MODEL=${FREELLMAPI_MODEL:-auto}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - RISK_PER_TRADE_PCT=${RISK_PER_TRADE_PCT:-0.5}
      - DAILY_LOSS_CAP_PCT=${DAILY_LOSS_CAP_PCT:-2.0}
      - NOTIFY_WEBHOOK_URL=${NOTIFY_WEBHOOK_URL:-}
      - RUN_CYCLE_ON_START=${RUN_CYCLE_ON_START:-false}
    expose:
      - "8000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=fino
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=fino
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fino -d fino"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
